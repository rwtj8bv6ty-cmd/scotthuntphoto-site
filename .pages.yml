# Editor setup for Pages CMS (https://app.pagescms.org). Sign in there with GitHub and open this repository.
media:
  input: photos
  output: /photos
  categories: [image]

content:
  - name: galleries
    label: Galleries
    type: collection
    path: content/galleries
    format: json
    filename: "{primary}.json"
    view:
      fields: [title, draft, order]
      primary: title
      sort: [order, title]
    fields:
      - { name: title, label: Gallery name, type: string, required: true }
      - { name: draft, label: "Draft (hidden until you turn this off)", type: boolean, default: true }
      - { name: slug, label: "Web address (e.g. landscapes). Leave blank to use the name", type: string }
      - { name: order, label: "Menu order (1 = first)", type: number, default: 10 }
      - { name: parent, label: "Show in a sub-menu under another gallery (its web address, e.g. anthologies). Leave blank for a main gallery", type: string }
      - { name: featured, label: Show on home page, type: boolean, default: true }
      - name: layout
        label: Layout
        type: select
        default: masonry
        options:
          values:
            - { value: masonry, label: "Masonry (keeps each photo's shape)" }
            - { value: grid, label: "Grid (even squares)" }
            - { value: single, label: "One large photo at a time" }
      - { name: cover, label: Cover photo, type: image }
      - { name: description, label: Introduction, type: rich-text }
      - name: photos
        label: "Photos (drag to reorder)"
        type: object
        list: true
        fields:
          - { name: image, label: Photo, type: image, required: true }
          - { name: title, label: Title, type: string }
          - { name: caption, label: Caption, type: string }
          - { name: alt, label: "Description for screen readers", type: string }

  - name: pages
    label: Pages
    type: collection
    path: content/pages
    format: json
    filename: "{primary}.json"
    view:
      fields: [title, draft, inMenu]
      primary: title
    fields:
      - { name: title, label: Page title, type: string, required: true }
      - { name: menuTitle, label: "Name in the menu (leave blank to use the page title)", type: string }
      - { name: draft, label: "Draft (hidden until you turn this off)", type: boolean, default: true }
      - { name: slug, label: "Web address (e.g. about). Leave blank to use the title. Use rockn-h for the Rock'n H landing page", type: string }
      - name: side
        label: Which side of the site
        type: select
        default: photography
        options:
          values:
            - { value: photography, label: "Scott Hunt Photography" }
            - { value: rocknh, label: "Rock'n H (sales and marketing)" }
      - { name: inMenu, label: Show in menu, type: boolean, default: true }
      - { name: order, label: "Menu order (1 = first)", type: number, default: 10 }
      - { name: image, label: Side photo, type: image }
      - { name: body, label: Text, type: rich-text }
      - { name: contactForm, label: Show the contact form on this page, type: boolean, default: false }

  - name: collections
    label: "Rock'n H print collections"
    type: collection
    path: content/collections
    format: json
    filename: "{primary}.json"
    view:
      fields: [title, draft, order]
      primary: title
    fields:
      - { name: title, label: Collection name, type: string, required: true }
      - { name: draft, label: "Draft (hidden until you turn this off)", type: boolean, default: true }
      - { name: slug, label: "Web address. Leave blank to use the name", type: string }
      - { name: order, label: "Menu order (1 = first)", type: number, default: 10 }
      - { name: cover, label: Cover photo, type: image }
      - { name: description, label: Introduction, type: rich-text }
      - name: options
        label: "Price list: materials, sizes and prices (used by every print without its own)"
        type: object
        list: true
        fields:
          - { name: material, label: "Material (e.g. Fine art paper)", type: string }
          - { name: size, label: "Size (e.g. 20 × 54 in)", type: string }
          - { name: price, label: "Price (number only)", type: string }
          - { name: edition, label: "Limited edition size for this size (e.g. 100; leave empty if none)", type: number }
      - name: roomPhotos
        label: "Room photos shown under this collection's prints on the Rock'n H home page (two or three sit side by side)"
        type: object
        list: true
        fields:
          - { name: image, label: Photo, type: image }
      - name: prints
        label: "Prints (drag to reorder)"
        type: object
        list: true
        fields:
          - { name: image, label: Photo, type: image, required: true }
          - { name: title, label: "Title of the work", type: string }
          - { name: featured, label: Show on the Rock'n H home page, type: boolean, default: false }
          - { name: description, label: "About this work (a short narrative shown on the print's page)", type: rich-text }
          - { name: alt, label: "Description for screen readers", type: string }
          - { name: editionSize, label: "Whole-print edition size, all sizes together (usually leave empty; set editions per size in the price list)", type: number }
          - { name: editionsSold, label: "Prints sold so far, all sizes together (shows Sold out when it reaches the whole-print edition size)", type: number, default: 0 }
          - name: sales
            label: "Prints sold, by size (include sales from before the website; a size sells out when this reaches its edition size)"
            type: object
            list: true
            fields:
              - { name: size, label: "Size (e.g. 7 × 19 in)", type: string }
              - { name: sold, label: "Number sold", type: number, default: 0 }
          - name: options
            label: "Materials, sizes and prices for this print (leave empty to use the collection's price list)"
            type: object
            list: true
            fields:
              - { name: material, label: "Material (e.g. Fine art paper)", type: string }
              - { name: size, label: "Size (e.g. 20 × 54 in)", type: string }
              - { name: price, label: "Price (number only)", type: string }
              - { name: edition, label: "Limited edition size for this size (e.g. 100; leave empty if none)", type: number }

  - name: site
    label: Site settings
    type: file
    path: content/site.json
    format: json
    fields:
      - { name: title, label: Site name, type: string }
      - { name: photographyTitle, label: Photography side name, type: string }
      - { name: rocknhTitle, label: "Sales side name", type: string }
      - { name: tagline, label: Tagline, type: string }
      - name: homeSlides
        label: "Featured photos for the photography home page (drag to reorder)"
        type: object
        list: true
        fields:
          - { name: image, label: Photo, type: image }
          - { name: title, label: Title, type: string }
      - { name: showCaptions, label: Show photo titles and captions to visitors, type: boolean, default: false }
      - { name: homeSlideSeconds, label: Seconds per slide, type: number }
      - { name: homeButtonLabel, label: Home page button text, type: string }
      - { name: galleriesMenuLabel, label: Menu name for galleries, type: string }
      - { name: rockLogo, label: "Rock'n H logo (optional, replaces the name in the header)", type: image }
      - { name: rockHeroImage, label: "Rock'n H home: large photo", type: image }
      - name: rockRoomPhotos
        label: "Rock'n H home: room photos, shown full width below the prints (drag to reorder)"
        type: object
        list: true
        fields:
          - { name: image, label: "Room photo", type: image }
      - { name: rockHeroHeading, label: "Rock'n H home: heading", type: string }
      - { name: rockHeroText, label: "Rock'n H home: tagline", type: string }
      - { name: rockHeroButton, label: "Rock'n H home: button text", type: string }
      - { name: rockFeaturedHeading, label: "Rock'n H home: featured prints heading", type: string }
      - { name: rockPrintsMenuLabel, label: "Rock'n H menu: name of the prints menu (e.g. The Prints)", type: string }
      - { name: rockStatementHeading, label: "Artist statement heading", type: string }
      - { name: rockStatementText, label: "Artist statement", type: rich-text }
      - { name: rockArtistHeading, label: "About the artist heading", type: string }
      - { name: rockArtistPhoto, label: "About the artist photo", type: image }
      - { name: rockArtistText, label: "About the artist", type: rich-text }
      - { name: rockPrintDetails, label: "Print pages: About the Prints", type: rich-text }
      - { name: rockMaterials, label: "Print pages: Materials", type: rich-text }
      - { name: rockLimitedEditions, label: "Print pages: Limited Editions", type: rich-text }
      - { name: rockDimensions, label: "Print pages: Dimensions and Borders", type: rich-text }
      - { name: rockShippingDetails, label: "Print pages: Shipping and Production Times", type: rich-text }
      - { name: rockPaypalClientId, label: "Checkout: PayPal Client ID (Live)", type: string }
      - { name: rockCurrency, label: "Checkout: currency code (e.g. USD)", type: string }
      - { name: rockShippingCost, label: "Checkout: flat shipping charge per order, used only while the shipping price table is empty (0 = included)", type: number }
      - name: rockShippingZones
        label: "Checkout: shipping regions (a region with no states covers the rest of the U.S.)"
        type: object
        list: true
        fields:
          - { name: name, label: "Region name (e.g. Texas)", type: string }
          - { name: states, label: "State codes, separated by commas (e.g. AK, HI); leave empty for everywhere else", type: string }
      - name: rockShippingRates
        label: "Checkout: shipping price table, one row per size and region (an order pays once, at the rate of its largest print)"
        type: object
        list: true
        fields:
          - { name: size, label: "Size (e.g. 7 × 19 in); matches price-list sizes with the same two numbers", type: string }
          - { name: zone, label: "Region name, exactly as above", type: string }
          - { name: price, label: "Shipping price (number only)", type: string }
      - name: rockSalesTax
        label: "Checkout: sales tax, one row per state where you collect it (leave empty to charge no tax)"
        type: object
        list: true
        fields:
          - { name: state, label: "State code (e.g. TX)", type: string }
          - { name: rate, label: "Tax rate in percent (e.g. 8.25)", type: string }
          - { name: taxShipping, label: "Also charge tax on shipping", type: boolean }
      - { name: rockShipOnRequest, label: "Checkout: materials shipped on request, separated by commas (e.g. Acrylic); these show a quote button instead of Add to cart", type: string }
      - { name: rockShippingNote, label: "Checkout: note shown in the cart", type: rich-text }
      - { name: rockInstagram, label: "Rock'n H Instagram (e.g. @rockn_h_editions_fine_art); shows an Instagram icon in the menu", type: string }
      - { name: rockNewsletter, label: Show newsletter sign-up, type: boolean }
      - { name: rockNewsletterHeading, label: Newsletter heading, type: string }
      - { name: rockContactSlug, label: "Web address of the Rock'n H contact page (used by Enquire buttons)", type: string }
      - { name: currencySymbol, label: Currency symbol, type: string }
      - { name: contactPageSlug, label: "Web address of the contact page (used by Enquire buttons)", type: string }
      - { name: formEndpoint, label: "Contact form address (Web3Forms or Formspree)", type: string }
      - { name: formAccessKey, label: "Web3Forms access key", type: string }
      - { name: goatcounterCode, label: "Visitor counts: your GoatCounter code (the name before .goatcounter.com); leave empty to switch off", type: string }
      - { name: wordHome, label: "Wording: Rock'n H menu: first item (default: Home)", type: string }
      - { name: wordAllPrints, label: "Wording: Rock'n H menu: first item under The Prints (default: All Prints)", type: string }
      - { name: wordViewAll, label: "Wording: Rock'n H home: link beside each prints heading (default: View all)", type: string }
      - { name: wordFeaturedFrom, label: "Wording: Rock'n H home: heading before a collection name (second and later collections) (default: Featured Prints from)", type: string }
      - { name: wordViewPhotographs, label: "Wording: Gallery introduction pages: link to the photos (default: View the photographs →)", type: string }
      - { name: wordComingSoon, label: "Wording: Galleries with no photos yet (default: Photographs coming soon.)", type: string }
      - { name: wordFooter, label: "Wording: Footer line after the copyright year and name (default: All photographs are protected by copyright.)", type: string }
      - { name: wordPricesFrom, label: "Wording: Print price before the lowest price (default: Prices from)", type: string }
      - { name: wordPriceOnRequest, label: "Wording: Print with no price (default: Price on request)", type: string }
      - { name: wordSoldOut, label: "Wording: Sold-out label (default: Sold out)", type: string }
      - { name: wordRemaining, label: "Wording: After the number left in an edition (default: remaining)", type: string }
      - { name: wordLimitedEdition, label: "Wording: Before the edition size on a print page (default: Limited edition of)", type: string }
      - { name: wordAddToCart, label: "Wording: Print page: buy button (default: Add to cart)", type: string }
      - { name: wordAddedToCart, label: "Wording: Print page: message after adding (default: Added to your cart.)", type: string }
      - { name: wordViewCart, label: "Wording: Print page: link after adding (default: View cart)", type: string }
      - { name: wordEnquire, label: "Wording: Button when a print has no price (default: Enquire)", type: string }
      - { name: wordShipQuoteNote, label: "Wording: Print page: note for materials shipped on request (default: Shipping for this material is quoted on request.)", type: string }
      - { name: wordShipQuote, label: "Wording: Print page: shipping quote button (default: Request a shipping quote)", type: string }
      - { name: wordSubscribe, label: "Wording: Newsletter button (default: Subscribe)", type: string }
      - { name: wordSendMessage, label: "Wording: Contact form button (default: Send message)", type: string }
      - { name: wordCartTitle, label: "Wording: Cart page heading (default: Your cart)", type: string }
      - { name: wordCartEmpty, label: "Wording: Cart page when empty (default: Your cart is empty.)", type: string }
      - { name: wordBrowsePrints, label: "Wording: Cart page: link when empty (default: Browse the prints)", type: string }
      - { name: wordNoShipRate, label: "Wording: Cart: when a size has no shipping price (default: We don't have a shipping price for one of these sizes yet.)", type: string }
      - { name: wordCheckoutOff, label: "Wording: Cart: when checkout is switched off (a "send us a message" link follows) (default: Online checkout is being set up. To order now,)", type: string }
      - { name: wordThanksTitle, label: "Wording: Cart: heading after payment (default: Thank you for your order)", type: string }
      - { name: wordThanksText, label: "Wording: Cart: message after payment (default: A receipt is on its way to your email. We'll be in touch about production and shipping.)", type: string }
      - { name: wordNotFound, label: "Wording: Missing-page heading (default: Page not found)", type: string }
      - { name: wordBackHome, label: "Wording: Missing-page link (default: Back to the home page)", type: string }
      - { name: customDomain, label: "Custom domain (e.g. www.scotthuntphoto.com)", type: string }
