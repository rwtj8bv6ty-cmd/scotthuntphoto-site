name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Make thumbnails for new photos
        run: pip install --quiet pillow && python scripts/thumbs.py
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: |
          domain=$(node -p "require('./content/site.json').customDomain || ''")
          if [ -n "$domain" ]; then export SITE_BASE=/ SITE_URL="https://$domain/"; else export SITE_BASE="${{ steps.pages.outputs.base_path }}/" SITE_URL="${{ steps.pages.outputs.base_url }}/"; fi
          node build.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
